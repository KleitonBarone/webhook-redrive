name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: webhook_redrive_test
          POSTGRES_USER: webhook_redrive
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U webhook_redrive -d webhook_redrive_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://webhook_redrive:test-only-password@localhost:5432/webhook_redrive_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal migrations)"
      - name: Run static analysis
        run: go vet ./...
      - name: Run tests
        run: go test -race -count=1 ./...

  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start local delivery stack
        run: docker compose up --build -d --wait
      - name: Verify retry and replay demo
        shell: pwsh
        run: ./scripts/demo.ps1
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: Verify finite load workload
        run: go run ./cmd/loadtest -scenario mixed -events 40 -revision "$GITHUB_SHA" -output load-result.json
      - name: Verify healthy deliveries beside timeouts
        run: go run ./cmd/loadtest -scenario fairness -events 40 -revision "$GITHUB_SHA" -output fairness-result.json
      - name: Stop demo before isolated measurement
        run: docker compose stop
      - name: Verify paced saturation and database evidence
        shell: pwsh
        run: ./scripts/measure-load.ps1 -Scenario saturation -Events 40 -Rate 10 -SlowEndpoints 5 -SlowConcurrency 2
      - name: Save workload evidence
        uses: actions/upload-artifact@v4
        with:
          name: load-result
          path: |
            load-result.json
            fairness-result.json
            artifacts/benchmark/**/*.json
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop local delivery stack
        if: always()
        run: docker compose down
